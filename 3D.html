<!DOCTYPE html>

<html id="html">

<head>
    <meta charset="UTF-8">
    <title>Issac Tiu - Gallery</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/x-icon" href="images/Logo.png">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
</head>

<body onload="changeBackgroundColor()">
    <header>
        <img id="logo" src="images/Logo.png" alt="Logo">
        <h1>Gallery</h1>
    </header>
    <ul id="header">
        <li><a href="index.html">Home</a></li>
        <li><a href="aboutme.html">About Me</a>
    </ul>

    <main>
        <section class="media-type">
            <a id="2D" class="media-button" href="2D.html">2D</a>
            <a id="3D" class="media-button" href="#">3D</a>
        </section>

        <section class="gallery-content">
            <div class="slideshow">
                <div class="slide">
                    <model-viewer src="models/Snake.glb" alt="A 3D model" auto-rotate camera-controls
                        shadow-intensity="1" max-camera-orbit="auto 90deg auto" disable-tap></model-viewer>
                    <div class="description">MGS1 Snake: Character, Low poly, Rigged</div>
                </div>

                <div class="slide">
                    <model-viewer src="models/Samurai.glb" alt="A 3D model" auto-rotate camera-controls
                        shadow-intensity="1" max-camera-orbit="auto 90deg auto" disable-tap></model-viewer>
                        <div class="description">Ronin: Character, Low poly, Rigged</div>
                </div>


                <div class="slide">
                    <model-viewer src="models/Cube_Land.glb" alt="A 3D model" auto-rotate camera-controls
                        shadow-intensity="1" max-camera-orbit="auto 90deg auto" disable-tap></model-viewer>
                        <div class="description">Cube Land: Environment, Low poly, Procedral</div>
                </div>

                <div class="slide">
                    <model-viewer src="models/Critter2.glb" alt="A 3D model" auto-rotate camera-controls
                        shadow-intensity="1" max-camera-orbit="auto 90deg auto" disable-tap></model-viewer>
                        <div class="description">Critter2: Character, Cel-Shaded, Sculpted</div>
                </div>

                <div class="slide">
                    <model-viewer src="models/Altas.glb" alt="A 3D model" auto-rotate camera-controls
                        shadow-intensity="1" max-camera-orbit="auto 90deg auto" disable-tap></model-viewer>
                        <div class="description">Altas: Character, Cel-Shaded, Procedral</div>
                </div>

                <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
                <a class="next" onclick="plusSlides(1)">&#10095;</a>
            </div>
        </section>

    </main>

    <footer>
        <a href="mailto:issac.tiu@outlook.com">issac.tiu@outlook.com</a>
    </footer>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="java/script.js"></script>
</body>

</html>
